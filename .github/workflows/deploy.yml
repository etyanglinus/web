name: Build and Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

# One production deploy at a time. If two PRs are merged close together, the second deploy waits
# for the first to finish instead of overwriting the same files on the server at the same time
# (that race is what failed run 42375716324). Never cancel a deploy halfway through.
concurrency:
  group: production-web-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies, build, and package
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build
          
          # Prepare standalone folder structure
          mkdir -p .next/standalone/.next/static
          cp -R .next/static/. .next/standalone/.next/static/
          cp -R public .next/standalone/
          
          # Explicitly include node_modules to supply helper modules like @swc/helpers
          cp -R node_modules .next/standalone/
          
          # Package everything into the deploy archive
          tar -czf fasta-web-${{ github.run_id }}.tar.gz -C .next/standalone .

      - name: Upload standalone app to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "fasta-web-${{ github.run_id }}.tar.gz"
          target: "/home/petrosup/fastadeliveries.co.ke/web/"

      - name: Extract app and restart cPanel Node.js app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/petrosup/fastadeliveries.co.ke/web/
            # Each run uploads its own uniquely named archive, so runs can't delete each other's file.
            tar -xzf fasta-web-${{ github.run_id }}.tar.gz
            rm -f fasta-web-${{ github.run_id }}.tar.gz
            # Clean up archives left by older runs (including the old fixed name).
            rm -f standalone-deploy.tar.gz
            find . -maxdepth 1 -name 'fasta-web-*.tar.gz' -mmin +60 -delete
            mkdir -p tmp
            touch tmp/restart.txt