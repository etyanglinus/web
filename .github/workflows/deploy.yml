name: Build and Deploy React Web to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies, build, and package
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn build
          mkdir -p .next/standalone/.next/static
          cp -R .next/static/. .next/standalone/.next/static/
          cp -R public .next/standalone/
          tar -czf standalone-deploy.tar.gz -C .next/standalone .

      - name: Upload standalone app to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "standalone-deploy.tar.gz"
          target: "/home/petrosup/fastadeliveries.co.ke/web/"

      - name: Extract app and restart cPanel Node.js app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/petrosup/fastadeliveries.co.ke/web/
            tar -xzf standalone-deploy.tar.gz
            rm standalone-deploy.tar.gz
            mkdir -p tmp
            touch tmp/restart.txt